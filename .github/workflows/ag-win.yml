name: AlightGram Windows

on:
  workflow_dispatch:
  push:
    branches:
      - 'desktop-ag-7.3.4'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 300

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Libraries cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Free up disk space (pre-build).
        shell: pwsh
        run: |
          $targets = @(
            "C:\Program Files\Android\AndroidSDK",
            "$env:ANDROID_HOME",
            "C:\Program Files\dotnet",
            "C:\hostedtoolcache\windows\ghc",
            "C:\hostedtoolcache\windows\julia",
            "C:\hostedtoolcache\windows\php",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\MySQL",
            "C:\hostedtoolcache\windows\PostgreSQL",
            "C:\hostedtoolcache\windows\mariaDB",
            "C:\hostedtoolcache\windows\stack",
            "C:\hostedtoolcache\windows\Miniconda",
            "C:\hostedtoolcache\windows\PyPy"
          )
          foreach ($t in $targets) {
            if (Test-Path $t) { Remove-Item -Recurse -Force $t -ErrorAction SilentlyContinue }
          }
          if (Get-Command docker -ErrorAction SilentlyContinue) { docker system prune -af 2>$null | Out-Null }
          Write-Output ("C: free GB: " + [math]::Round((Get-PSDrive C).Free/1GB,1))

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Ensure wallet_engine generated file (fork prepare quirk).
        shell: pwsh
        run: |
          $expected = "$env:LibrariesPath\tdesktop_rust\out\src\wallet_engine\wallet_engine.cpp"
          if (Test-Path $expected) { Write-Output "wallet_engine.cpp present"; exit 0 }
          Write-Output "expected file missing, searching..."
          $found = Get-ChildItem "$env:LibrariesPath\tdesktop_rust" -Recurse -Filter "wallet_engine.cpp" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { $found = Get-ChildItem "$env:LibrariesPath" -Recurse -Filter "wallet_engine.cpp" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $found) { Write-Output "ERROR: wallet_engine.cpp not found anywhere"; exit 1 }
          Write-Output "found at $($found.FullName)"
          New-Item -ItemType Directory -Force -Path (Split-Path $expected) | Out-Null
          Copy-Item $found.FullName $expected -Force
          Write-Output "copied into place"

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=4 ^
          -D TDESKTOP_API_HASH=014b35b6184100b085b0d0572f9b5103 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Telegram.exe artifact\
          move %OUT%\Updater.exe artifact\

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: AlightGram-Windows-x64
          path: artifact\
          retention-days: 14
          if-no-files-found: error
